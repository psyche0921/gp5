<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#241a3a"/>
      <stop offset="55%" stop-color="#0d0b14"/>
      <stop offset="100%" stop-color="#07060a"/>
    </radialGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2e9a"/>
      <stop offset="100%" stop-color="#34e2ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="#322c44" stroke-width="4"/>
  <text x="256" y="300" text-anchor="middle" font-family="Segoe UI, Roboto, sans-serif" font-weight="700"
        font-size="176" fill="url(#neon)" filter="url(#glow)">GP5</text>
</svg>
